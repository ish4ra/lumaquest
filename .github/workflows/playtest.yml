name: LumaQuest Dev Beta

on:
  workflow_dispatch:
  push:
    branches: [ main, visual-overhaul ]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/playtest.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip -q Godot_v3.5.3-stable_linux_headless.64.zip
          chmod +x Godot_v3.5.3-stable_linux_headless.64
          sudo mv Godot_v3.5.3-stable_linux_headless.64 /usr/local/bin/godot
      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/3.5.3.stable
          unzip -q Godot_v3.5.3-stable_export_templates.tpz
          cp -r templates/* ~/.local/share/godot/templates/3.5.3.stable/
      - name: Validate project boot
        run: |
          set -o pipefail
          timeout 8s godot --path . --no-window 2>&1 | tee boot.log || code=$?
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:" boot.log; then exit 1; fi
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then exit "${code}"; fi
      - name: Build Windows playtest
        run: |
          set -o pipefail
          mkdir -p build
          godot --path . --no-window --export "Windows Desktop" build/LumaQuest.exe 2>&1 | tee export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:" export.log; then exit 1; fi
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: LumaQuest-Windows-Candidate
          path: build/

  windows-runtime-test:
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: LumaQuest-Windows-Candidate
          path: build
      - name: Native Windows startup test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\LumaQuest.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "LumaQuest exited during startup smoke test. Exit code: $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
      - name: Package verified Dev Beta
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path ".\\build\\*" -DestinationPath ".\\LumaQuest-Windows-Dev-Beta.zip" -Force
      - name: Publish rolling Dev Beta release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-beta --repo "${{ github.repository }}" --yes --cleanup-tag 2>$null
          gh release create dev-beta ".\\LumaQuest-Windows-Dev-Beta.zip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "LumaQuest Dev Beta" --notes "Development beta of the rebuilt Green Fields vertical slice. Not v1.0.0." --prerelease
